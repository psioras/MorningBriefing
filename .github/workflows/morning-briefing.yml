name: Morning Briefing

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily, 09:00 UTC+2 for GR — on summer it becomes 10:00 UTC+3
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Morning Briefing
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENWEATHER_UNITS:   ${{ secrets.OPENWEATHER_UNITS }}
          OPENWEATHER_LAT:     ${{ secrets.OPENWEATHER_LAT }}
          OPENWEATHER_LON:     ${{ secrets.OPENWEATHER_LON }}
          NTFY_TOPIC_DEV:      ${{ secrets.NTFY_TOPIC_DEV }}
          NTFY_TOPIC:          ${{ secrets.NTFY_TOPIC }}

        run: dotnet run --project MorningBriefing.cspro
